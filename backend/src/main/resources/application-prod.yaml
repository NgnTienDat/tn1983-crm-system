# src/main/resources/application-prod.yml
# Không có secret nào ở đây — tất cả đến từ /opt/tn1983/backend.env trên VM.
spring:
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:8}

# Tắt Swagger/OpenAPI trên production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.cf.tn1983: INFO
    org.springframework.web: INFO