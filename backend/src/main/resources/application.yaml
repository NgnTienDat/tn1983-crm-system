spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/tn1983_crm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

security:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:${JWT_SECRET:change-this-development-access-secret-key-32}}
    refresh-secret: ${JWT_REFRESH_SECRET:${JWT_SECRET:change-this-development-refresh-secret-key-32}}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
  admin:
    phone: ${ADMIN_PHONE:0900000000}
    password: ${ADMIN_PASSWORD:admin123}

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000   # dev
    # allowed-origins: https://trongnhamcoffee.me                      # prod

