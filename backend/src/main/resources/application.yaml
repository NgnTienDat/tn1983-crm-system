# src/main/resources/application.yml
# Config chung cho mọi môi trường. KHÔNG đặt giá trị mặc định cho secret ở đây
# -> thiếu biến môi trường thì app fail ngay lúc khởi động, không âm thầm chạy bằng key dev.
spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway là chủ sở hữu schema, Hibernate chỉ kiểm tra
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  lifecycle:
    timeout-per-shutdown-phase: 20s
  
  web:
    error:
      include-stacktrace: never
      include-message: never

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework   # đứng sau nginx: đọc X-Forwarded-Proto/For


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

security:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Strict}
  admin:
    phone: ${ADMIN_PHONE}
    password: ${ADMIN_PASSWORD}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

rate-limit:
  auth:
    capacity: 30
    refill: 30
    duration: 1m
  tracking:
    capacity: 30
    refill: 30
    duration: 1m
  admin:
    capacity: 300
    refill: 300
    duration: 1m