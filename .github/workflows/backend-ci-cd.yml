name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "21"
  IMAGE_NAME: tn1983-backend

jobs:
  # =========================================================
  # JOB 1: TEST
  # =========================================================
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tn1983_crm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/tn1983_crm_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_ACCESS_SECRET: ci-only-access-secret-key-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-key-at-least-32-characters
      ADMIN_PHONE: "0900000000"
      ADMIN_PASSWORD: ci-only-admin-password
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B -ntp verify

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: backend/target/surefire-reports/*.xml
          require_tests: false

  # =========================================================
  # JOB 2: BUILD & PUSH DOCKER IMAGE
  # =========================================================
  build-and-push:
    name: build-and-push
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push to Docker Hub
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          REPO_PATH="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          docker build -t $REPO_PATH:latest \
                       -t $REPO_PATH:$IMAGE_TAG \
                       ./backend

          docker push $REPO_PATH:$IMAGE_TAG
          docker push $REPO_PATH:latest

  # =========================================================
  # JOB 3: DEPLOY OVER SSH
  # =========================================================
  deploy:
    name: deploy
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: ${{ secrets.AZURE_VM_SSH_PORT }}
          script: |
            set -e
            cd /opt/tn1983

            echo "--------- Đăng nhập Docker Hub ---------"
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "--------- Pull Image mới nhất ---------"
            docker compose pull backend

            echo "--------- Cập nhật Container ---------"
            docker compose up -d --remove-orphans backend

            echo "--------- Kiểm tra Health Check ---------"
            OK=0
            for i in $(seq 1 30); do
              if docker compose exec -T backend curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
                OK=1; break
              fi
              sleep 5
            done

            if [ "$OK" != "1" ]; then
              echo "::error::Health check thất bại!"
              docker compose logs --tail 200 backend || true
              docker logout
              exit 1
            fi

            echo "--------- Dọn dẹp Image cũ ---------"
            docker logout
            docker image prune -af --filter "until=168h"